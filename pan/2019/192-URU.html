<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de PDF</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
        }

        .pdf-fullscreen {
            width: 100%;
            height: 100vh; 
            border: none;
        }
    </style>
</head>
<body>

    <!-- Se añade #toolbar=0&navpanes=0 al final de la ruta -->
    <embed src="192-URU.pdf#toolbar=0&navpanes=0" type="application/pdf" class="pdf-fullscreen" />

</body>
</html>
